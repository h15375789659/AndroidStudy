# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ===== JVM Memory Settings =====
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# ===== Build Performance Optimization =====
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
org.gradle.parallel=true

# Enable Gradle build cache to speed up builds
org.gradle.caching=true

# Gradle daemon runs in the background to improve startup time
org.gradle.daemon=true

# ===== Network & Proxy Settings =====
# If you are behind a proxy or in China, uncomment and configure these:
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
# systemProp.http.nonProxyHosts=*.local|localhost

# Use Alibaba/Tencent mirrors for faster downloads in China (if needed)
# org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Dmaven.repo.local=~/.m2/repository

# ===== AndroidX Settings =====
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# ===== Kotlin Settings =====
# Enable incremental compilation for Kotlin (faster builds)
kotlin.incremental=true

# Enable parallel compilation for Kotlin
kotlin.parallel.tasks.in.project=true

# Disable Gradle Kotlin DSL source download (避免网络问题)
kotlin.dsl.skipMetadataVersionCheck=true
systemProp.org.gradle.kotlin.dsl.resolver.source.download=false

# ===== Build Features =====
# Disable unused build features to improve performance
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false